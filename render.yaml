# =============================================================================
# Render Blueprint (D-12) — infra-as-code for the deploy. Compute = Render (free
# Docker web service); database = Neon (external, set the secrets in the dashboard).
# Decoupling the DB avoids Render free-Postgres' 30-day deletion.
# =============================================================================
services:
  - type: web
    name: currency-ledger
    runtime: docker
    plan: free                      # spins down after 15 min idle (~1-min cold start)
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # --- Neon (set in dashboard; never committed) ---
      - key: DATABASE_URL           # app role — DML only
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_MIGRATION_USERNAME  # migration role — DDL (Flyway)
        sync: false
      - key: DB_MIGRATION_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"                  # modest pool for the free instance
    # --- Neon provisioning notes (out of band; not Render config) ---
    # 1) Durable session guards: run once against Neon as the role owner so they survive PgBouncer
    #    pooling (finding #1 — mirrors db/init/00-roles.sql for dev/test):
    #      ALTER ROLE app SET statement_timeout = '3s';
    #      ALTER ROLE app SET lock_timeout = '2s';
    #      ALTER ROLE app SET idle_in_transaction_session_timeout = '10s';
    # 2) Scale-out (finding #7): the default `ondemand` provider caches per instance, so >1 replica
    #    multiplies Treasury load. For multi-instance, set FX_RATES_PROVIDER=ingest (or hybrid) so all
    #    replicas read the shared exchange_rates table (DB is the shared store; no Redis). See D-03.
