# Build performance & determinism. The JDK is resolved via the Java toolchain
# (language version 21 in build.gradle.kts) / JAVA_HOME — not pinned here, so CI
# and local stay portable.
org.gradle.parallel=true
org.gradle.caching=true
# configuration-cache left off: the Flyway/PIT plugins aren't fully compatible yet.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
