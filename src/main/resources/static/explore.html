<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WEX FX Ledger — Interactive Explorer</title>
<meta name="description" content="Interactive explorer for the WEX USD purchase ledger + Treasury currency-conversion service. Switch between the Codebase and the Live App." />
<link rel="icon" href="data:," /><!-- empty icon: suppresses the favicon request under a strict default-src 'none' CSP -->
<style>
  :root{
    --bg:#0d1117; --bg-elev:#161b22; --bg-elev2:#1c2230; --border:#30363d;
    --fg:#e6edf3; --fg-dim:#9da7b3; --fg-faint:#6a7681;
    --wex:#e4002b; --wex-soft:#ff3355; --accent:#58a6ff;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --tok-comment:#6a7681; --tok-string:#7ee787; --tok-keyword:#ff7b72;
    --tok-type:#79c0ff; --tok-annotation:#d2a8ff; --tok-number:#f0883e;
    --tok-flag:#ffa657; --tok-key:#79c0ff;
    --radius:10px; --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  code,pre{font-family:var(--mono)}
  h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
  h2{font-size:1.5rem;border-bottom:1px solid var(--border);padding-bottom:.35em;margin-top:.2em}
  h3{font-size:1.15rem;margin-top:1.6em;color:var(--fg)}
  h4{font-size:1rem;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  p{margin:.6em 0}
  ul{margin:.5em 0 .5em 1.1em;padding:0}
  li{margin:.3em 0}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(13,17,23,.88);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:12px 22px}
  .brand{display:flex;align-items:baseline;gap:10px;font-weight:700;font-size:1.05rem;white-space:nowrap}
  .brand .dot{color:var(--wex)}
  .brand small{color:var(--fg-faint);font-weight:500;font-size:.78rem}
  .spacer{flex:1}
  .toggle{display:inline-flex;background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;padding:3px}
  .toggle button{appearance:none;border:0;background:transparent;color:var(--fg-dim);font:inherit;font-weight:600;
    font-size:.82rem;letter-spacing:.03em;padding:7px 16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
  .toggle button .ic{font-size:.9rem}
  .toggle button.active{color:#fff}
  .toggle button[data-ctx="codebase"].active{background:#1f6feb}
  .toggle button[data-ctx="live"].active{background:var(--wex)}
  .topbar .readme-link{color:var(--fg-dim);font-size:.82rem;white-space:nowrap}
  .topbar .readme-link:hover{color:var(--fg)}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:236px 1fr;gap:0;max-width:1280px;margin:0 auto}
  .sidebar{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow-y:auto;
    border-right:1px solid var(--border);padding:18px 12px 40px}
  .side-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-faint);padding:0 12px;margin:14px 0 8px}
  .sidebar nav a{display:flex;align-items:center;gap:10px;color:var(--fg-dim);padding:8px 12px;border-radius:7px;
    font-size:.9rem;font-weight:500;cursor:pointer}
  .sidebar nav a .ic{width:18px;text-align:center;color:var(--fg-faint);font-size:.85rem}
  .sidebar nav a:hover{background:var(--bg-elev);color:var(--fg);text-decoration:none}
  .sidebar nav a.active{background:var(--bg-elev2);color:var(--fg)}
  .sidebar nav a.active .ic{color:var(--wex-soft)}
  .ctx-codebase .sidebar nav a.active{box-shadow:inset 2px 0 0 #1f6feb}
  .ctx-live .sidebar nav a.active{box-shadow:inset 2px 0 0 var(--wex)}

  main{padding:26px 34px 90px;min-width:0;max-width:920px}
  .crossref{background:var(--bg-elev);border:1px solid var(--border);border-left:3px solid var(--wex);
    border-radius:8px;padding:10px 14px;font-size:.86rem;color:var(--fg-dim);margin-bottom:22px;display:flex;gap:10px;align-items:center}
  .crossref b{color:var(--fg)}

  /* ---------- shared bits ---------- */
  .lead{font-size:1.05rem;color:var(--fg-dim);max-width:70ch}
  .pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;
    border:1px solid var(--border);color:var(--fg-dim);background:var(--bg-elev);white-space:nowrap}
  .pill.d{color:#d2a8ff;border-color:#3b2c54}
  .pill.f{color:#7ee787;border-color:#1f3d28}
  .pill.ok{color:var(--ok);border-color:#1f3d28}
  .pill.warn{color:var(--warn);border-color:#4a3a14}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .card h4{margin-top:0}
  .card.hl{border-color:#3b2c54}
  .muted{color:var(--fg-dim)}
  .faint{color:var(--fg-faint)}
  .kpi{font-size:1.7rem;font-weight:700}
  .kpi.red{color:var(--wex-soft)} .kpi.green{color:var(--ok)} .kpi.blue{color:var(--accent)}
  .filelink{font-family:var(--mono);font-size:.8rem;color:var(--fg-faint)}

  table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:.88rem}
  th,td{border:1px solid var(--border);padding:8px 11px;text-align:left;vertical-align:top}
  th{background:var(--bg-elev);color:var(--fg-dim);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
  tr:nth-child(even) td{background:rgba(255,255,255,.012)}
  td code{font-size:.82rem;color:#a5d6ff}

  /* ---------- code blocks ---------- */
  .codeblock{position:relative;background:#0b0f15;border:1px solid var(--border);border-radius:10px;margin:14px 0;overflow:hidden}
  .codeblock .cb-head{display:flex;align-items:center;gap:10px;padding:8px 13px;border-bottom:1px solid var(--border);
    background:var(--bg-elev);font-size:.78rem;color:var(--fg-dim)}
  .codeblock .cb-head .fname{font-family:var(--mono);color:var(--fg-dim)}
  .codeblock .cb-head .spacer{flex:1}
  .copybtn{appearance:none;border:1px solid var(--border);background:var(--bg-elev2);color:var(--fg-dim);
    font:inherit;font-size:.74rem;padding:3px 10px;border-radius:6px;cursor:pointer}
  .copybtn:hover{color:var(--fg);border-color:var(--fg-faint)}
  .codeblock pre{margin:0;padding:14px 16px;overflow-x:auto;font-size:.82rem;line-height:1.6;white-space:pre}
  .codeblock.wrap pre{white-space:pre-wrap;word-break:break-word}
  .tok-comment{color:var(--tok-comment);font-style:italic}
  .tok-string{color:var(--tok-string)}
  .tok-keyword{color:var(--tok-keyword)}
  .tok-type{color:var(--tok-type)}
  .tok-annotation{color:var(--tok-annotation)}
  .tok-number{color:var(--tok-number)}
  .tok-flag{color:var(--tok-flag)}
  .tok-string-key{color:var(--tok-key)}

  /* tabs */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
  .tabs button{appearance:none;border:1px solid var(--border);background:var(--bg-elev);color:var(--fg-dim);
    font:inherit;font-size:.8rem;padding:6px 12px;border-radius:7px 7px 0 0;border-bottom:0;cursor:pointer;margin-bottom:-1px}
  .tabs button.active{background:#0b0f15;color:var(--fg);border-color:var(--border)}

  /* controls */
  .control{display:flex;flex-direction:column;gap:5px}
  .control label{font-size:.78rem;color:var(--fg-dim);font-weight:600}
  input[type=text],input[type=date],input[type=number],select{
    background:var(--bg-elev);border:1px solid var(--border);color:var(--fg);border-radius:7px;padding:8px 10px;
    font:inherit;font-size:.9rem;font-family:var(--mono)}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .btn{appearance:none;border:1px solid var(--border);background:var(--bg-elev2);color:var(--fg);font:inherit;
    font-weight:600;font-size:.85rem;padding:9px 16px;border-radius:8px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--fg-faint)}
  .btn.primary{background:var(--wex);border-color:var(--wex);color:#fff}
  .btn.primary:hover{background:var(--wex-soft)}
  .btn.blue{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .btn.blue:hover{background:#388bfd}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:6px}
  .badge.chosen{background:rgba(63,185,80,.14);color:var(--ok);border:1px solid #1f3d28}
  .badge.out{background:rgba(110,118,129,.12);color:var(--fg-faint);border:1px solid var(--border)}
  .badge.future{background:rgba(210,153,34,.12);color:var(--warn);border:1px solid #4a3a14}
  .badge.method{font-family:var(--mono)}
  .badge.post{background:rgba(63,185,80,.14);color:var(--ok)}
  .badge.get{background:rgba(88,166,255,.14);color:var(--accent)}

  .result-box{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:14px}
  .result-box.good{border-color:#1f3d28}
  .result-box.bad{border-color:#5a2327}
  .bignum{font-size:1.5rem;font-weight:700;font-family:var(--mono)}

  .stepbox{font-family:var(--mono);font-size:.82rem;color:var(--fg-dim);background:#0b0f15;border:1px solid var(--border);
    border-radius:8px;padding:12px 14px;margin-top:10px;white-space:pre-wrap;line-height:1.7}
  .stepbox b{color:var(--ok)}

  .banner{border-radius:8px;padding:11px 14px;font-size:.85rem;margin:14px 0;border:1px solid}
  .banner.info{background:rgba(88,166,255,.07);border-color:#1f3a5c;color:#bcd4f0}
  .banner.warn{background:rgba(210,153,34,.07);border-color:#4a3a14;color:#e8cf93}

  .endpoint{border:1px solid var(--border);border-radius:10px;margin:16px 0;overflow:hidden}
  .endpoint .ep-head{display:flex;align-items:center;gap:11px;padding:11px 15px;background:var(--bg-elev);cursor:pointer}
  .endpoint .ep-head .path{font-family:var(--mono);font-size:.9rem}
  .endpoint .ep-head .desc{color:var(--fg-faint);font-size:.82rem;margin-left:auto}
  .endpoint .ep-body{padding:15px;border-top:1px solid var(--border);display:none}
  .endpoint.open .ep-body{display:block}
  .ep-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}

  .hide{display:none!important}
  .dl-card{border:1px solid var(--border);border-radius:9px;margin:10px 0;overflow:hidden;background:var(--bg-elev)}
  .dl-card .dl-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
  .dl-card .dl-head:hover{background:var(--bg-elev2)}
  .dl-card .dl-title{font-weight:600}
  .dl-card .dl-body{padding:0 14px 13px;display:none;color:var(--fg-dim);font-size:.9rem}
  .dl-card.open .dl-body{display:block}
  .dl-filter{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .dl-filter button{appearance:none;border:1px solid var(--border);background:var(--bg-elev);color:var(--fg-dim);
    font:inherit;font-size:.78rem;padding:5px 12px;border-radius:999px;cursor:pointer}
  .dl-filter button.active{background:var(--bg-elev2);color:var(--fg);border-color:var(--fg-faint)}

  .footer{max-width:1280px;margin:0 auto;border-top:1px solid var(--border);padding:22px 34px;color:var(--fg-faint);font-size:.82rem}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-elev2);
    border:1px solid var(--border);color:var(--fg);padding:9px 16px;border-radius:8px;font-size:.85rem;opacity:0;
    pointer-events:none;transition:.22s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .arch{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .arch .layer{border:1px solid var(--border);border-radius:9px;padding:12px 15px;cursor:pointer;transition:.15s;background:var(--bg-elev)}
  .arch .layer:hover{border-color:var(--fg-faint)}
  .arch .layer.sel{border-color:var(--wex)}
  .arch .layer .lname{font-weight:700;display:flex;align-items:center;gap:10px}
  .arch .layer .ltag{font-size:.72rem;color:var(--fg-faint);font-family:var(--mono)}
  .arch .layer .ldesc{font-size:.84rem;color:var(--fg-dim);margin-top:4px;display:none}
  .arch .layer.sel .ldesc{display:block}
  .arch .domain{border-left:3px solid #d2a8ff}
  .arch .application{border-left:3px solid #79c0ff}
  .arch .adapter{border-left:3px solid var(--wex)}
  .arch .config{border-left:3px solid var(--warn)}

  @media(max-width:860px){
    .layout{grid-template-columns:1fr}
    .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}
    .sidebar nav{display:flex;flex-wrap:wrap;gap:4px}
    .sidebar nav a{flex:0 0 auto}
    .grid2,.grid3{grid-template-columns:1fr}
    main{padding:20px 16px 70px}
    .topbar{flex-wrap:wrap;gap:10px}
  }
</style>
</head>

<script>
/* ============================================================================
   WEX FX Ledger — interactive explorer (single file, zero dependencies)
   Two contexts: CODEBASE (architecture, decisions, real code, live playgrounds)
   and LIVE APP (connect + API playground against the deployed service).
   ========================================================================== */

/* ----- optional overrides (both work empty) -----
   When this page is SERVED BY THE APP, the Live App tab targets the same origin
   automatically — no setup needed. These are only fallbacks for opening the file
   offline (file://), and a nicety for deep-linking source on the repo host. */
const DEPLOYED_URL = ""; // offline fallback base, e.g. "https://wex-fx-ledger.onrender.com"
const REPO_URL     = ""; // e.g. "https://github.com/you/wex-fx-ledger" -> makes the .md links resolve

/* ===================== tiny helpers ===================== */
function el(id){return document.getElementById(id);}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function toast(msg){var t=el("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},1600);}
function copy(text){navigator.clipboard&&navigator.clipboard.writeText(text).then(function(){toast("Copied");},function(){toast("Copy failed");});}

/* ===================== syntax highlighter ===================== */
function tokenize(code, patterns){
  var combined = new RegExp(patterns.map(function(p){return "("+p[1].source+")";}).join("|"), "g");
  var out="", last=0, m;
  while((m = combined.exec(code))){
    if(m.index < last){combined.lastIndex = last; continue;}
    out += escapeHtml(code.slice(last, m.index));
    var cls=null, text=m[0];
    for(var i=0;i<patterns.length;i++){ if(m[i+1]!==undefined){cls=patterns[i][0];break;} }
    out += '<span class="tok-'+cls+'">'+escapeHtml(text)+'</span>';
    last = m.index + text.length;
    if(text.length===0){combined.lastIndex++;}
  }
  out += escapeHtml(code.slice(last));
  return out;
}
var JAVA_PAT = [
  ["comment", /\/\/[^\n]*|\/\*[\s\S]*?\*\//],
  ["string", /"(?:\\.|[^"\\])*"/],
  ["annotation", /@[A-Za-z_][A-Za-z0-9_]*/],
  ["keyword", /\b(?:public|private|protected|final|static|class|record|interface|enum|return|if|else|for|new|throws|throw|void|int|boolean|import|package|null|this|implements|extends|true|false)\b/],
  ["type", /\b(?:BigDecimal|RoundingMode|LocalDate|Optional|List|Comparator|String|Money|ExchangeRate|RateSelector|Objects|Pattern|Integer|Supplier|Retry|CircuitBreaker)\b/],
  ["number", /\b\d+(?:\.\d+)?\b/]
];
var JSON_PAT = [
  ["string-key", /"(?:\\.|[^"\\])*"(?=\s*:)/],
  ["string", /"(?:\\.|[^"\\])*"/],
  ["keyword", /\b(?:true|false|null)\b/],
  ["number", /-?\b\d+(?:\.\d+)?\b/]
];
var BASH_PAT = [
  ["comment", /#[^\n]*/],
  ["string", /'(?:[^'])*'|"(?:\\.|[^"\\])*"/],
  ["keyword", /\b(?:curl)\b/],
  ["flag", /-{1,2}[A-Za-z][A-Za-z-]*/]
];
var CSV_PAT = [
  ["comment", /#[^\n]*/],
  ["string", /[A-Za-z][A-Za-z &]+/],
  ["number", /\b\d+\b/]
];
function hl(code, lang){
  var pat = lang==="json"?JSON_PAT: lang==="bash"?BASH_PAT: lang==="csv"?CSV_PAT: JAVA_PAT;
  return tokenize(code, pat);
}
function codeblock(fname, code, lang, wrap){
  var id = "cb_"+(codeblock._n=(codeblock._n||0)+1);
  var w = wrap?" wrap":"";
  return '<div class="codeblock'+w+'">'
    + '<div class="cb-head"><span class="fname">'+escapeHtml(fname)+'</span><span class="spacer"></span>'
    + '<button class="copybtn" data-copy="'+id+'">Copy</button></div>'
    + '<pre id="'+id+'">'+hl(code, lang)+'</pre></div>';
}

/* ===================== Java-faithful date math ===================== */
function pad2(n){return (n<10?"0":"")+n;}
function pad4(n){n=String(n);while(n.length<4)n="0"+n;return n;}
function isoOf(y,m,d){return pad4(y)+"-"+pad2(m)+"-"+pad2(d);} // m is 1-based
function lastDayOfMonth(y, m1){ return new Date(Date.UTC(y, m1, 0)).getUTCDate(); } // m1 1-based
// Mirrors java.time.LocalDate.minusMonths: shift the month, then clamp the day to the
// last valid day of the resulting month (e.g. Aug 31 - 6mo -> Feb 28/29).
function minusMonths(dateStr, months){
  var p = dateStr.split("-"); var y=+p[0], m=+p[1], d=+p[2];
  var total = (y*12 + (m-1)) - months;
  var ny = Math.floor(total/12);
  var nm0 = total - ny*12;            // 0-based month
  var nm1 = nm0 + 1;                   // 1-based
  var ld = lastDayOfMonth(ny, nm1);
  return isoOf(ny, nm1, Math.min(d, ld));
}
// ISO yyyy-mm-dd compares correctly as strings for non-negative years.
function dcmp(a,b){return a<b?-1:a>b?1:0;}

/* ===================== fixed-point money (mirrors Money.java) ===================== */
// No float anywhere: scaled BigInt arithmetic, HALF_UP, single final rounding to scale 2.
function parseScaled(str){
  str = String(str).trim();
  if(!/^-?\d+(\.\d+)?$/.test(str)) throw new Error("not a plain decimal: "+str);
  var neg = str[0]==="-"; if(neg) str=str.slice(1);
  var parts = str.split("."); var intp=parts[0], frac=parts[1]||"";
  var scale = frac.length;
  var value = BigInt((intp+frac)||"0");
  if(neg) value = -value;
  return {value:value, scale:scale};
}
function rescaleHalfUp(value, scale, target){
  if(target>=scale){ return {value: value*(10n**BigInt(target-scale)), scale:target}; }
  var drop = scale-target, div = 10n**BigInt(drop);
  var neg = value<0n, v = neg?-value:value;
  var q = v/div, r = v%div;
  if(r*2n >= div) q = q+1n;            // HALF_UP
  if(neg) q = -q;
  return {value:q, scale:target};
}
function formatScaled(value, scale){
  var neg = value<0n, v = neg?-value:value, s=v.toString();
  if(scale===0) return (neg?"-":"")+s;
  while(s.length<=scale) s="0"+s;
  return (neg?"-":"")+s.slice(0,s.length-scale)+"."+s.slice(s.length-scale);
}
// convertedAt: principal (scale<=2) x rate (any scale) at full precision, round once to 2.
function convertMoney(amountStr, rateStr){
  var amt = parseScaled(amountStr);
  if(amt.scale>2) throw new Error("amount has more than 2 decimals (the API returns 400 AMOUNT_PRECISION)");
  var principal = rescaleHalfUp(amt.value, amt.scale, 2);  // pad to scale 2
  var rate = parseScaled(rateStr);
  var prodVal = principal.value * rate.value;
  var prodScale = 2 + rate.scale;                          // full precision product
  var rounded = rescaleHalfUp(prodVal, prodScale, 2);      // the ONE rounding
  return {
    result: formatScaled(rounded.value, rounded.scale),
    principal: formatScaled(principal.value, 2),
    rateScale: rate.scale,
    productRaw: formatScaled(prodVal, prodScale),

  };

SNIP.money =
"public Money {\n"+
"    Objects.requireNonNull(amount, \"amount must not be null\");\n"+
"    Objects.requireNonNull(currencyCode, \"currencyCode must not be null\");\n"+
"    if (!ISO_4217.matcher(currencyCode).matches()) {\n"+
"        throw new IllegalArgumentException(\"currencyCode must match [A-Z]{3}, was: \" + currencyCode);\n"+
"    }\n"+
"    // The ONE rounding in the money path (D-04). Pads a cent-precise principal; performs\n"+
"    // the single, final rounding for a conversion product. Never pre-round a rate/intermediate.\n"+
"    amount = amount.setScale(SCALE, ROUNDING);   // SCALE=2, ROUNDING=HALF_UP\n"+
"}\n\n"+
"public Money convertedAt(BigDecimal rate, String targetCurrencyCode) {\n"+
"    Objects.requireNonNull(rate, \"rate must not be null\");\n"+
"    // full-precision multiply; the constructor above rounds exactly once.\n"+
"    return new Money(amount.multiply(rate), targetCurrencyCode);\n"+
"}";
SNIP.rate =
"public Optional<ExchangeRate> select(List<ExchangeRate> candidates, LocalDate purchaseDate) {\n"+
"    Objects.requireNonNull(purchaseDate, \"purchaseDate must not be null\");\n"+
"    if (candidates == null || candidates.isEmpty()) {\n"+
"        return Optional.empty();\n"+
"    }\n"+
"    LocalDate floor = windowFloor(purchaseDate);\n"+
"    return candidates.stream()\n"+
"            .filter(r -> !r.effectiveDate().isAfter(purchaseDate))  // effectiveDate <= purchaseDate\n"+
"            .filter(r -> !r.effectiveDate().isBefore(floor))        // effectiveDate >= floor (inclusive)\n"+
"            .max(Comparator.comparing(ExchangeRate::effectiveDate)  // latest effectiveDate wins\n"+
"                    .thenComparing(ExchangeRate::recordDate));      // deterministic tiebreak (F8)\n"+
"}\n\n"+
"public LocalDate windowFloor(LocalDate purchaseDate) {\n"+
"    return purchaseDate.minusMonths(windowMonths);   // calendar months, not 180 days\n"+
"}";
SNIP.resilience =
"// Retry OVER circuit-breaker: a tripped breaker fails fast without burning retries.\n"+
"private <T> T guarded(Supplier<T> call) {\n"+
"    Supplier<T> decorated = Retry.decorateSupplier(retry,\n"+
"            CircuitBreaker.decorateSupplier(circuitBreaker, call));\n"+
"    try {\n"+
"        return decorated.get();\n"+
"    } catch (CallNotPermittedException e) {           // breaker open -> 503 + Retry-After\n"+
"        throw RateProviderUnavailableException.circuitOpen(e);\n"+
"    } catch (ResourceAccessException e) {              // timeout -> 504, else 502\n"+
"        throw isTimeout(e) ? ...timeout(e) : ...badGateway(e);\n"+
"    } catch (HttpServerErrorException e) {             // upstream 5xx -> 502\n"+
"        throw RateProviderUnavailableException.badGateway(e);\n"+
"    }\n"+
"    // Every failure collapses to ONE domain signal -> 502/503/504. Never a hang, never a 500.\n"+
"}";

  ["D-01","Currency input &amp; mapping","decision","ISO-4217 in, resolved through a curated, version-controlled CSV map to Treasury <code>country_currency_desc</code>. <b>XOF ≠ XAF</b> — both read \"Cfa Franc\" but are different rates."],

  ["D-03","Rate acquisition strategy","decision","A single <code>ExchangeRateProvider</code> port with four adapters (passthrough / ondemand / hybrid / ingest). Default is on-demand; strategy is a config flag."],
  ["D-04","Money &amp; rounding","decision","<code>BigDecimal</code> only — never float/double. Compute at full precision, round <b>once</b> at the end, HALF_UP, scale 2. Compare with <code>compareTo</code>."],
  ["D-05","Amount precision","decision","Reject amounts with >2 decimals (<code>400 AMOUNT_PRECISION</code>) — never silently round the principal. The only rounding is the derived conversion output."],
  ["D-06","Date validation","decision","Parse strictly as ISO local date. Reject <b>future</b> dates (400). Store too-old dates but fail conversion later with 422."],
  ["D-07","USD target","decision","<code>USD→USD</code> is an in-app identity: rate <code>1.00</code>, convertedAmount = original, <b>no upstream Treasury call</b>."],
  ["D-08","Identifier &amp; idempotency","decision","Server-generated <b>UUIDv7</b> (time-ordered) stored as native <code>uuid</code>. <code>Idempotency-Key</code> makes R1 safely retryable."],
  ["D-09","API contract &amp; resource design","decision","RFC 9457 <code>application/problem+json</code> with machine <code>code</code> + <code>traceId</code>. Append-only (no PUT/PATCH/DELETE). 400 = malformed, 422 = well-formed but unfulfillable."],
  ["D-10","Persistence &amp; local dev","decision","Postgres + Flyway (plain SQL), Spring Data JDBC, Testcontainers (no H2). Least-privilege DB roles: <code>migration</code> (DDL) vs <code>app</code> (DML)."],
  ["D-11","Test strategy","decision","Deterministic: injected <code>Clock</code>, <b>zero real network in the gate</b> (WireMock + Testcontainers), PIT mutation testing on the money / rate core."],

INIT.playground = function(){

    var amt = el("pgAmt").value.trim();

/* Make the .md doc links resolve in every context. `data-doc` holds the repo-root-relative path
   (e.g. "docs/DECISION_LOG.md"); this file lives at src/main/resources/static/, so the repo root is
   four directories up. Rewrite to the repo host when REPO_URL is set; point at the on-disk file when
   opened offline (file://); and when served by the app (where the markdown isn't a static route)
   degrade to a hint instead of a dead 404. */
var REPO_ROOT_FROM_HERE = "../../../../"; // src/main/resources/static/ -> repo root
function wireDocLinks(){
  var served = location.protocol==="http:"||location.protocol==="https:";
  Array.prototype.forEach.call(document.querySelectorAll('a[data-doc]'), function(a){
    if(a._docWired) return; a._docWired = true;
    var path = a.getAttribute("data-doc");
    if(REPO_URL){
      a.setAttribute("href", REPO_URL.replace(/\/+$/,"")+"/blob/main/"+path);
      a.setAttribute("target","_blank"); a.setAttribute("rel","noopener");
    } else if(served){
      a.setAttribute("href","#"); a.setAttribute("title", path+" — in the repository");
      a.addEventListener("click", function(e){ e.preventDefault(); toast("See "+path+" in the repository"); });
    } else {
      a.setAttribute("href", REPO_ROOT_FROM_HERE + path); // file:// -> resolve up to the repo root
    }
  });
}

  + codeblock("request", 'curl -sS "'+baseUrl()+'/v1/purchases/019e93ff-fbad-7d54-aec5-948f732030b0/conversions/USD"', "bash", true)
  + codeblock("200 OK — no upstream call", EX.usd200, "json");
};

/* ===================== shared UI builders ===================== */
function crossref(otherCtx){
  if(otherCtx==="live"){
    return '<div class="crossref">◉ <span>You\'re exploring the <b>codebase</b>. Want to poke the running service? '
      + 'Switch to <a data-ctx="live">Live App</a> — connect a URL and fire real requests.</span></div>';
  }
  return '<div class="crossref">&lt;/&gt; <span>You\'re in the <b>Live App</b>. Curious how it works inside? '
    + 'Switch to <a data-ctx="codebase">Codebase</a> — architecture, decisions, real source and live playgrounds.</span></div>';
}
function kpi(color,big,label){
  return '<div class="card"><div class="kpi '+color+'">'+big+'</div><div class="muted" style="font-size:.85rem">'+label+'</div></div>';
}
function navcard(id,title,desc){
  return '<div class="card hl" style="cursor:pointer" data-goto="'+id+'"><h4 style="color:var(--fg)">'+title+'</h4>'
    + '<p class="muted" style="margin:.3em 0 0">'+desc+'</p></div>';
}

/* ===================== copy wiring ===================== */
function wireCopy(){
  Array.prototype.forEach.call(document.querySelectorAll(".copybtn[data-copy]"), function(b){
    if(b._wired) return; b._wired=true;
    b.addEventListener("click", function(){
      var pre = el(b.getAttribute("data-copy")); if(pre) copy(pre.textContent);
    });
  });
}

/* ===================== router ===================== */
function setContext(ctx){
  if(ctx===state.ctx) return;
  state.ctx = ctx;
  state.id = SECTIONS[ctx][0].id;
  document.body.className = "ctx-"+ctx;
  Array.prototype.forEach.call(document.querySelectorAll(".toggle button"), function(b){
    b.classList.toggle("active", b.getAttribute("data-ctx")===ctx);
  });
  el("sideLabel").textContent = ctx==="codebase" ? "Explore the code" : "Explore the live app";
  renderNav(); renderSection(); syncHash();
}
function go(id, ctx){
  if(ctx && ctx!==state.ctx){ setContext(ctx); }
  // ensure id belongs to current context
  var ok = SECTIONS[state.ctx].some(function(s){return s.id===id;});
  if(!ok) return;
  state.id = id; renderNav(); renderSection(); syncHash();
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderNav(){
  var html = "";
  SECTIONS[state.ctx].forEach(function(s){
    html += '<a data-goto="'+s.id+'"'+(s.id===state.id?' class="active"':'')+'>'
      + '<span class="ic">'+s.ic+'</span> '+s.label+'</a>';
  });
  el("nav").innerHTML = html;
}
function renderSection(){
  var fn = RENDER[state.id];
  el("main").innerHTML = fn ? fn() : '<h2>Not found</h2>';
  if(INIT[state.id]) INIT[state.id]();
  wireCopy();
  wireDocLinks();
}
function syncHash(){ history.replaceState(null,"","#"+state.ctx+"/"+state.id); }

/* delegated navigation: data-goto (+ optional data-ctx) and data-ctx links */
document.addEventListener("click", function(e){
  var ctxBtn = e.target.closest(".toggle button[data-ctx]");
  if(ctxBtn){ setContext(ctxBtn.getAttribute("data-ctx")); return; }
  var goto = e.target.closest("[data-goto]");
  if(goto){ e.preventDefault(); go(goto.getAttribute("data-goto"), goto.getAttribute("data-ctx")); return; }
  var ctxLink = e.target.closest("a[data-ctx]");
  if(ctxLink){ e.preventDefault(); setContext(ctxLink.getAttribute("data-ctx")); return; }
});

/* ===================== boot ===================== */
(function boot(){
  var h = (location.hash||"").replace(/^#/,"").split("/");
  if(h.length===2 && SECTIONS[h[0]] && SECTIONS[h[0]].some(function(s){return s.id===h[1];})){
    state.ctx = h[0]; state.id = h[1];
  }
  document.body.className = "ctx-"+state.ctx;
  Array.prototype.forEach.call(document.querySelectorAll(".toggle button"), function(b){
    b.classList.toggle("active", b.getAttribute("data-ctx")===state.ctx);
  });
  el("sideLabel").textContent = state.ctx==="codebase" ? "Explore the code" : "Explore the live app";
  renderNav(); renderSection();
})();
</script>
</body>
</html>
