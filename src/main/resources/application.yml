# =============================================================================
# Common configuration (all profiles). Profile-specific overrides follow below,
# separated by `---`. Secrets NEVER live here — they come from env (.env / Render).
# =============================================================================
spring:
  application:
    name: currency-ledger
  # D-10: virtual threads make the blocking Treasury client cheap (no reactive).
  threads:
    virtual:
      enabled: true
  # Framework MVC exceptions (405 on an unmapped verb, 415/406 on media-type mismatch, 404 on an
  # unknown route, 400 on an unreadable body) render as RFC 9457 problem+json, then ApiExceptionHandler
  # enriches them with our machine `code` + `traceId`. Without this they would be bare Servlet errors.
  mvc:
    problemdetails:
      enabled: true
  # D-04 / api-contract: money & rates are JSON STRINGS, no scientific notation;
  # requests reject unknown fields (fail fast at the edge).
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-bigdecimal-as-plain: true
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  # Flyway owns the schema; the app never auto-generates DDL.
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    # DDL runs as the least-privilege `migration` role (see data-model.md / .env).
    locations: classpath:db/migration
  # Hikari tuning + Postgres session guards on the APP datasource only (NOT Flyway — its
  # `spring.flyway.*` connection is separate, so migrations can legitimately run long). A stuck
  # statement or a lock wait must never pin a pooled connection until the 30s default and cascade
  # into pool exhaustion. `connection-init-sql` runs once per physical connection (resiliency #2):
  #   • statement_timeout 3s — every app query is a sub-ms PK op, so 3s is generous headroom;
  #   • lock_timeout 2s      — fail fast rather than queue behind a held row lock;
  #   • idle_in_transaction 10s — reap a connection abandoned mid-transaction.
  # connection-timeout is in ms (Hikari) — fail acquisition fast (5s), not the 30s default.
  datasource:
    hikari:
      connection-timeout: 5000          # ms — fail fast acquiring a pooled connection
      validation-timeout: 3000          # ms
      keepalive-time: 120000            # ms — probe idle connections so dead ones are evicted early
      max-lifetime: 1800000             # ms — recycle a connection well before any server-side cap
      connection-init-sql: "SET statement_timeout = '3s'; SET lock_timeout = '2s'; SET idle_in_transaction_session_timeout = '10s'"

# Graceful shutdown so Render's 15-min spin-down/restart is clean (D-12).
server:
  port: ${PORT:8080}                    # Render injects PORT; default 8080 locally
  shutdown: graceful
  forward-headers-strategy: framework   # behind Render's proxy (X-Forwarded-*)
  # Request-size hardening (constitution §9, CC-2). Our payloads are tiny by contract (a ≤50-char
  # description, a short amount/date, a ≤255-char Idempotency-Key), so cap headers and bodies low: an
  # oversized request is rejected at the connector before it reaches a handler, never silently truncated.
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 16KB       # form posts are not a route we accept; keep the bound tight
    max-swallow-size: 16KB              # abort (don't drain) a body that exceeds the limit

# fx.* — domain tunables bound via @ConfigurationProperties (wired in later phases).
fx:
  # POST idempotency replay window (data-model.md). After it lapses the swept key may be reused.
  idempotency:
    ttl: 24h
    # TTL sweep (finding #1): IdempotencySweeper deletes rows past `expires_at` so the table can't grow
    # unbounded. `sweep-interval` is the scheduled cadence (also the initial delay, so it never fires
    # mid-startup); `sweep-batch-size` bounds each DELETE's lock window — the sweep loops until drained.
    sweep-interval: 1h
    sweep-batch-size: 1000
  # fx.rates.* binds to RatesProperties (@ConfigurationProperties). Every key is optional —
  # @DefaultValue mirrors the values below — but we spell out the production posture here so the
  # operational knobs (timeouts, retry/breaker thresholds, cache TTLs) are discoverable, not magic.
  rates:
    # D-03: A0 passthrough | A on-demand+cache (DEFAULT) | B ingest | C hybrid.
    provider: ondemand
    # D-02 / rate-selection.md: max(effective_date) ≤ purchaseDate within this many calendar months.
    window-months: 6
    treasury:
      base-url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
      connect-timeout: 2s             # bounded — never an unbounded wait on the dependency
      read-timeout: 5s
    # Provider-A cache (Caffeine), quarter-aware TTL: settled past quarters are immutable (cache long);
    # the current still-amendable quarter caches briefly so a late amendment (F8) is picked up; a
    # "no rate" outcome caches only briefly. Upstream failures are never cached.
    cache:
      settled-ttl: 30d
      current-quarter-ttl: 10m
      negative-ttl: 1m
      maximum-size: 10000
    # Retries are bounded and fire ONLY on transient upstream failures (5xx / timeout / connection),
    # never on a 4xx or a malformed body; the breaker fails fast once the recent failure rate trips.
    resilience:
      max-attempts: 2
      # Exponential backoff with jitter: initial wait `retry-backoff`, grown by `retry-multiplier`
      # per attempt, randomized by ±`retry-randomization-factor` to de-synchronize retry waves.
      # With max-attempts=2 the single backoff lands in [100ms, 300ms] — worst case well under 1s.
      retry-backoff: 200ms
      retry-multiplier: 2.0
      retry-randomization-factor: 0.5
      sliding-window-size: 20
      # Keep <= sliding-window-size; the Resilience4j default (100) would never be reached by a
      # 20-wide COUNT_BASED window, leaving the breaker permanently closed.
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      wait-duration-in-open-state: 30s
      permitted-calls-in-half-open-state: 3
    # Providers B (ingest) / C (hybrid) only: the out-of-band sync that backfills/reconciles the local
    # exchange_rates table. window-months bounds how far back to ingest; interval is the reconcile cadence
    # (catches current-quarter amendments). Inert under A0/A.
    sync:
      window-months: 24
      interval: 6h

management:
  endpoints:
    web:
      exposure:
        # Only `health` is exposed — liveness/readiness probes and the platform health
        # check (Render `healthCheckPath: /actuator/health`, the explorer's health widget)
        # need nothing else. `/info` carried no value and is dropped to shrink the surface
        # (constitution §9). `GET /actuator/info` therefore returns 404.
        include: health
  endpoint:
    health:
      probes:
        enabled: true          # liveness/readiness for the platform health check
        show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# springdoc: serve our AUTHORED contract (src/main/resources/static/openapi.yaml)
# in Swagger UI — design-first, not code-generated (api-contract.md).
# NOTE: `api-docs.enabled` must stay true — it gates springdoc's whole
# auto-config, so disabling it also tears down the Swagger UI. We instead point
# the UI at the static file (`url`) and suppress the petstore default, so the
# authored openapi.yaml remains the single source of truth. prod turns it all off.
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /openapi.yaml
    disable-swagger-default-url: true
  api-docs:
    enabled: true

---
# =============================== dev ==========================================
# One-command local dev: docker-compose starts Postgres (and runs db/init, which
# creates the roles); Swagger on; human-readable logs. The app connects as the
# least-privilege `app` role and Flyway as `migration` — explicit because the
# compose service is labelled `ignore` (no @ServiceConnection superuser wiring).
spring:
  config:
    activate:
      on-profile: dev
  docker-compose:
    enabled: true
    lifecycle-management: start_and_stop
    file: compose.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/currency_ledger
    username: ${DATABASE_USERNAME:app}
    password: ${DATABASE_PASSWORD:change-me-app}
  flyway:
    # DDL runs as the migration role — its own connection, distinct from the app's.
    url: jdbc:postgresql://localhost:5432/currency_ledger
    user: ${DB_MIGRATION_USERNAME:migration}
    password: ${DB_MIGRATION_PASSWORD:change-me-migration}
    # Demo seed (db/seed) is layered on for dev/prod only — never for `test`.
    locations: classpath:db/migration,classpath:db/seed
logging:
  level:
    com.wex.fx: DEBUG
    org.springframework.jdbc.core: DEBUG

---
# =============================== test =========================================
# Determinism: Testcontainers Postgres (@ServiceConnection), fixed Clock, no docker-compose.
spring:
  config:
    activate:
      on-profile: test
  docker-compose:
    enabled: false

---
# =============================== prod =========================================
# Neon Postgres via env; structured JSON logs; Swagger gated off; DDL via Flyway only.
spring:
  config:
    activate:
      on-profile: prod
  docker-compose:
    enabled: false
  datasource:
    url: ${DATABASE_URL}                 # Neon JDBC URL (app role — DML only)
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Pool size (default 10, override via DB_POOL_SIZE). Virtual threads (D-10) make request
      # threads cheap, but the DB pool is the real concurrency bound: every conversion does at most a
      # couple of sub-ms PK queries, so 10 connections sustain a high request rate without starving
      # Neon's connection budget. Raise DB_POOL_SIZE only if connection-wait shows up under load.
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    # DDL runs as the migration role on its own connection (distinct from the app
    # role) — least privilege. Same Neon database URL, migration credentials.
    url: ${DATABASE_URL}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    # The running deployment is a public demo — layer the seed data (db/seed) in.
    locations: classpath:db/migration,classpath:db/seed
server:
  error:
    include-message: never
    include-stacktrace: never            # never leak internals (constitution §4/§5)
# Spring Boot structured logging → ECS JSON on stdout (Render captures it).
logging:
  structured:
    format:
      console: ecs
springdoc:
  swagger-ui:
    enabled: false                       # gate the API explorer in prod
  api-docs:
    enabled: false                       # and the generated /v3/api-docs endpoint
