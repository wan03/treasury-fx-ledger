name: keep-warm

# Manual "warm it now" fallback for the Render free-tier instance (spins down after
# ~15 min idle, ~1-min cold start; see render.yaml).
#
# The PRIMARY keep-warm is an EXTERNAL uptime pinger (e.g. cron-job.org / UptimeRobot)
# hitting the health endpoint on a schedule — far more reliable than GitHub's `schedule`
# trigger, which is best-effort, heavily throttled, and in practice never fired here.
# Recommended pinger config (windowed, to stay under Render's 750 instance-hrs/month cap):
#   • URL      : https://currency-ledger.onrender.com/actuator/health
#   • method   : GET, expect HTTP 200
#   • schedule : */10 13-23 * * 1-5   (every 10 min, 13:00-23:00 UTC, Mon-Fri)
# See the README "Keeping the demo warm" section.
#
# This workflow is therefore manual-dispatch ONLY — a one-click button to warm the
# instance on demand (e.g. right before a demo). The unreliable GitHub cron was removed.
on:
  workflow_dispatch: # Actions tab → keep-warm → "Run workflow"

permissions: {} # no repo access needed — we only make an outbound request

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /actuator/health
        env:
          # Overridable via a repo Actions variable without editing this file.
          URL: ${{ vars.KEEP_WARM_URL || 'https://currency-ledger.onrender.com' }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --max-time 150 \
            "$URL/actuator/health"
