# =============================================================================
# CI — the FAST gate that fences every PR (constitution §10, test-strategy §5).
# Runs the pure/slice suite + ArchUnit boundaries + the JaCoCo core-coverage
# floor via `./gradlew check`. ZERO real network and NO container runtime:
# `integrationTest` (Testcontainers + WireMock) and the live canary are NOT run
# here — they live in nightly.yml so a PR never waits on Docker or on Treasury.
# =============================================================================
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: fast gate (unit + slice + ArchUnit + coverage floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v6

      # `check` = test + jacocoTestCoverageVerification + ArchUnit. No Docker needed.
      - name: ./gradlew check
        run: ./gradlew check --no-daemon --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
